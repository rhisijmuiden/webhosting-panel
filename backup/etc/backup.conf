# /etc/webhosting-panel/backup/backup.conf
# Read by whp-backup as KEY="value" lines (never executed as shell code).

# Host name stored in snapshots. Empty = `hostname -f`.
BACKUP_HOST=""

# What is backed up. Every directory below SITES_ROOT / MAIL_ROOT that is a
# domain name becomes its own snapshot series (site:<domain>, mail:<domain>),
# so a single site or mail domain can be restored on its own.
SITES_ROOT="/var/www/vhosts"
MAIL_ROOT="/var/vmail"
SYSTEM_PATHS="/etc/webhosting-panel /etc/nginx /etc/php /etc/mysql /etc/postfix /etc/dovecot /etc/rspamd /etc/letsencrypt /etc/crowdsec /etc/nftables.conf /etc/unbound /var/lib/webhosting-panel/panel"

# Every MariaDB database becomes db:<name> (consistent dump, InnoDB).
DATABASES="yes"
DB_EXCLUDE="information_schema performance_schema sys mysql"
# Optional client config with credentials; empty = unix socket as root.
MARIADB_DEFAULTS_FILE=""

# Retention, per snapshot series. A target can override these in target.conf.
KEEP_LAST="3"
KEEP_DAILY="7"
KEEP_WEEKLY="4"
KEEP_MONTHLY="6"
KEEP_YEARLY="0"

# restic compression: auto, max or off.
COMPRESSION="auto"
# Upload limit in KiB/s, 0 = unlimited.
LIMIT_UPLOAD_KIB="0"
# Part of the remote data that `check --read-data` downloads and verifies.
CHECK_READ_DATA_SUBSET="2%"
# Take a snapshot of the current state before every in-place restore,
# so a restore can be undone.
PRE_RESTORE_SNAPSHOT="yes"

# Automatic restore tests (`whp-backup verify`, started by the panel).
# A sample of the newest restore points is restored into this scratch folder
# (and databases into a private, throw-away MariaDB instance), checked and
# removed again. Never a folder with live data.
VERIFY_DIR="/var/lib/webhosting-panel/restore-test"
# What one run tests per location (the panel can override these per run).
# Items tested longest ago go first, so every run covers other ones.
VERIFY_SYSTEM="yes"
VERIFY_SITES="2"
VERIFY_MAIL="1"
VERIFY_DATABASES="3"
# latest = the newest restore point; both = also the newest full one.
VERIFY_KINDS="both"
# Warn when the newest backup of something on this server is older than this.
VERIFY_MAX_AGE_HOURS="36"
# Skip an item (warning) when restoring it would leave less free disk than this.
VERIFY_MIN_FREE_PERCENT="10"
# Memory of the private MariaDB instance used for the database test.
VERIFY_DB_MEMORY_MB="256"
# Random PHP files of a website that are syntax checked after the restore.
VERIFY_PHP_LINT="25"
