; RHIS defaults for SnappyMail. install.sh copies this to
; /var/lib/snappymail/_data_/_default_/configs/application.ini on first install
; and replaces @...@ placeholders. SnappyMail adds any missing keys itself.

[webmail]
title = "@BRAND@ Webmail"
loading_description = "@BRAND@"
favicon_url = "themes/RHIS/images/favicon.svg"
theme = "RHIS@custom"
allow_themes = Off
allow_user_background = Off
language = "en"
allow_languages_on_settings = On
allow_additional_accounts = On
allow_additional_identities = On
messages_per_page = 50
attachment_size_limit = 25

[login]
default_domain = ""
allow_languages_on_login = On
determine_user_language = On
determine_user_domain = Off
sign_me_auto = "DefaultOff"

[contacts]
enable = On
allow_sync = On
type = "sqlite"

[security]
custom_server_signature = "@BRAND@"
; The panel manages domains and settings; the SnappyMail admin screen stays off.
allow_admin_panel = Off
force_https = On
hide_x_mailer_header = On
cookie_samesite = "Strict"
openpgp = On
gnupg = Off

[admin_panel]
allow_update = Off

[ssl]
verify_certificate = On
allow_self_signed = Off

[logs]
enable = Off

[cache]
enable = On
fast_cache_driver = "files"

[labs]
allow_message_append = On
