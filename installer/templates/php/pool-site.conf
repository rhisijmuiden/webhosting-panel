; Managed by whp-site. Site: {{SITE_DOMAIN}}
[site-{{SITE_ID}}]
user = {{SITE_USER}}
group = {{SITE_USER}}
listen = /run/php/site-{{SITE_ID}}.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = {{SITE_PM_MAX}}
pm.process_idle_timeout = 20s
pm.max_requests = 1000
request_terminate_timeout = {{SITE_TERMINATE_TIMEOUT}}
catch_workers_output = yes
chdir = /

php_admin_value[open_basedir] = {{SITE_ROOT}}/:/usr/share/php/:/dev/urandom
php_admin_value[upload_tmp_dir] = {{SITE_ROOT}}/tmp
php_admin_value[sys_temp_dir] = {{SITE_ROOT}}/tmp
php_admin_value[session.save_path] = {{SITE_ROOT}}/sessions
php_admin_value[error_log] = {{SITE_ROOT}}/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_value[disable_functions] = {{SITE_DISABLE_FUNCTIONS}}
php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f {{SITE_SENDER}}
env[TMPDIR] = {{SITE_ROOT}}/tmp
env[HOME] = {{SITE_ROOT}}

{{SITE_PHP_INI_LINES}}
