; Managed by the Webhosting Panel installer.
; PHP-FPM needs one pool to start; this one serves nothing and stays idle.
[whp-idle]
user = www-data
group = www-data
listen = /run/php/php{{PHP_VERSION}}-idle.sock
listen.owner = root
listen.group = root
listen.mode = 0600
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
