; Managed by whp-site. PHP-FPM master for {{SITE_DOMAIN}} (unit whp-site-{{SITE_ID}}).
[global]
pid = /run/php/site-{{SITE_ID}}.pid
error_log = /var/log/webhosting-panel/php-fpm/{{SITE_ID}}.log
log_level = notice
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s
