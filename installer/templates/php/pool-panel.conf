; Managed by the Webhosting Panel installer.
[whp-panel]
user = whp
group = whp
listen = /run/php/whp-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
pm.max_requests = 1000
php_admin_value[error_log] = /var/log/webhosting-panel/php-error.log
php_admin_flag[log_errors] = on
