# Managed by the Webhosting Panel installer. Shared by FTPS and SFTP.
AuthOrder mod_auth_file.c
AuthUserFile /etc/proftpd/whp/ftpd.passwd
AuthGroupFile /etc/proftpd/whp/ftpd.group
AuthFileOptions SyntaxCheck
RequireValidShell off
UseFtpUsers off
RootLogin off
PersistentPasswd off
# Every account is locked in its own folder (its home in ftpd.passwd).
DefaultRoot ~
DefaultChdir ~
# Files belong to the website's own Linux user, as with its main SFTP account.
Umask 022 022
AllowOverwrite on
AllowStoreRestart on
AllowRetrieveRestart on
ShowSymlinks on
TimeoutLogin 60
TimeoutIdle 900
TimeoutNoTransfer 900
TimeoutStalled 600
MaxLoginAttempts 4
DisplayLogin none
# Read-only accounts (group whp-ftp-ro): download and list only.
<Limit WRITE SITE_CHMOD SITE_CHGRP SITE_COPY SITE_SYMLINK SITE_UTIME MFMT MFF RNFR>
  DenyGroup whp-ftp-ro
</Limit>
