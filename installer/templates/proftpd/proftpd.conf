# Managed by the Webhosting Panel installer (installer/modules/75-ftp.sh).
# Extra FTP/SFTP accounts per website: virtual users only, written by whp-agent
# (ftp.sync) to /etc/proftpd/whp/ftpd.passwd. Linux users (root, site users)
# cannot log in here; the main SFTP account of a site stays on OpenSSH.
#   FTP  {{FTP_PORT}}   TLS required (explicit FTPS), passive {{FTP_PASV_MIN}}-{{FTP_PASV_MAX}}
#   SFTP {{SFTP_PORT}}

ModulePath /usr/lib/proftpd
ModuleControlsACLs insmod,rmmod allow user root
ModuleControlsACLs lsmod allow user *
LoadModule mod_ctrls_admin.c
LoadModule mod_tls.c
LoadModule mod_sftp.c
LoadModule mod_ifsession.c

ServerName "{{WHP_HOSTNAME}}"
ServerType standalone
ServerIdent on "FTP server ready"
DefaultServer on
UseIPv6 on
Port {{FTP_PORT}}
PassivePorts {{FTP_PASV_MIN}} {{FTP_PASV_MAX}}
MaxInstances 100
MaxClientsPerHost 20
User proftpd
Group nogroup
PidFile /run/proftpd.pid
ScoreboardFile /run/proftpd.scoreboard
ControlsEngine on
ControlsSocket /run/proftpd.sock
ControlsACLs all allow user root
ControlsLog /var/log/proftpd/controls.log
# Errors and logins go to the journal (CrowdSec reads them there).
TransferLog /var/log/proftpd/xferlog
UseReverseDNS off
DeferWelcome on
ListOptions "-a"

Include /etc/proftpd/whp/common.conf

<IfModule mod_tls.c>
  TLSEngine on
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRequired on
  TLSRSACertificateFile {{CERT_FILE}}
  TLSRSACertificateKeyFile {{KEY_FILE}}
  TLSCertificateChainFile {{CERT_FILE}}
  TLSOptions NoSessionReuseRequired
  TLSRenegotiate none
  TLSVerifyClient off
</IfModule>

<IfModule mod_sftp.c>
  <VirtualHost 0.0.0.0>
    Port {{SFTP_PORT}}
    SFTPEngine on
    SFTPHostKey /etc/proftpd/whp/ssh_host_ecdsa_key
    SFTPHostKey /etc/proftpd/whp/ssh_host_rsa_key
    SFTPAuthMethods password
    SFTPCompression delayed
    SFTPClientMatch ".*WinSCP.*" sftpProtocolVersion 3
    MaxLoginAttempts 4
    Include /etc/proftpd/whp/common.conf
  </VirtualHost>
</IfModule>
