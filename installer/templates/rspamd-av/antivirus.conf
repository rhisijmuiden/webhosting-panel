# Managed by the Webhosting Panel installer: scan mail with ClamAV.
clamav {
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  symbol = "CLAM_VIRUS";
  type = "clamav";
  action = "reject";
  servers = "127.0.0.1:3310";
  log_clean = false;
  patterns {
    JUST_EICAR = '^Eicar-Signature$';
  }
}
