; Managed by the Webhosting Panel installer (installer/modules/82-phpmyadmin.sh).
; phpMyAdmin runs as its own user and can only read its own folders.
[whp-pma]
user = whp-pma
group = whp-pma
listen = /run/php/whp-pma.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[open_basedir] = /var/www/phpmyadmin/:/var/lib/phpmyadmin/:/run/whp-pma/
php_admin_value[upload_tmp_dir] = /var/lib/phpmyadmin/tmp
php_admin_value[sys_temp_dir] = /var/lib/phpmyadmin/tmp
php_admin_value[session.save_path] = /var/lib/phpmyadmin/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 14400
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 512M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 600
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/phpmyadmin/php-error.log
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
