# Managed by the Webhosting Panel installer (installer/modules/82-phpmyadmin.sh).
# phpMyAdmin on the panel address; people get in only through sign-on from the panel.
location ^~ /phpmyadmin/ {
    root /var/www;
    index index.php;
    location ~ /\. { deny all; }
    location ~ ^/phpmyadmin/(libraries|templates|vendor|sql|locale|src|config|setup)(/|$) { deny all; }
    location ~ ^/phpmyadmin/.+\.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/whp-pma.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host:$server_port;
        fastcgi_read_timeout 600;
    }
}
