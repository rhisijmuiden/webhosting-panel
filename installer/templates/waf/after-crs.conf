# Managed by the Webhosting Panel installer (module waf). Adjustments that must
# follow the OWASP CRS rules they change.

# WordPress login cookies hold a signed token, never user input.
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/^wordpress_logged_in_/"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/^wp-settings-/"
