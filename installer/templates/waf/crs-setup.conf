# Managed by the Webhosting Panel installer (module waf). OWASP CRS setup in
# anomaly scoring mode: every matching rule adds points and a request is
# blocked when its total reaches the threshold (server.conf, set in the panel).

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Methods that apps and REST APIs (WordPress, Laravel) use.
SecAction "id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Lets CRS know it has been set up.
SecAction "id:900990,phase:1,pass,t:none,nolog,setvar:tx.crs_setup_version=400"
