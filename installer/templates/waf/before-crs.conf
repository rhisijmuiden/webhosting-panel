# Managed by the Webhosting Panel installer (module waf). Known false alarms
# of popular apps, before the OWASP CRS rules run. Rule ids 1000-1999.
# Only fields that are meant to hold HTML, code or free text are skipped, and
# only on the pages that edit them; everything else is still checked.

# --- WordPress -------------------------------------------------------------
# Passwords may contain anything.
SecRule REQUEST_FILENAME "@rx /wp-login\.php$" \
    "id:1000,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:pwd,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:post_password"
SecRule REQUEST_FILENAME "@rx /wp-admin/(?:user-new|user-edit|profile)\.php$" \
    "id:1001,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:pass1,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:pass2,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:pass1-text"
# Classic editor and post settings: posts are HTML.
SecRule REQUEST_FILENAME "@rx /wp-admin/(?:post|post-new)\.php$" \
    "id:1002,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:content,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:post_title,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:excerpt,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_wp_http_referer"
# Block editor (Gutenberg) saves through the REST API as JSON.
SecRule REQUEST_FILENAME "@rx /wp-json/wp/v2/(?:posts|pages|blocks|templates|template-parts|global-styles|navigation|wp_block|wp_template|wp_template_part|wp_navigation)" \
    "id:1003,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.content,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.title,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.excerpt,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.styles"
# The same without pretty links: /?rest_route=/wp/v2/posts/12
SecRule ARGS_GET:rest_route "@rx ^/wp/v2/(?:posts|pages|blocks|templates|template-parts|global-styles|navigation)" \
    "id:1004,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.content,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.title,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.excerpt,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.styles"
# Theme and plugin file editors, Customizer, widgets, menus and settings.
SecRule REQUEST_FILENAME "@rx /wp-admin/(?:theme-editor|plugin-editor)\.php$" \
    "id:1005,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:newcontent"
SecRule REQUEST_FILENAME "@rx /wp-admin/admin-ajax\.php$" \
    "id:1006,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:newcontent,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:customized,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:content,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:data[wp_autosave][content],ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:data[wp_autosave][post_title]"
SecRule REQUEST_FILENAME "@rx /wp-admin/(?:customize|widgets|nav-menus)\.php$" \
    "id:1007,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:customized,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_NAMES"
SecRule REQUEST_FILENAME "@rx /wp-admin/options(?:-general)?\.php$" \
    "id:1008,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:blogdescription,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:blogname,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_wp_http_referer"
# WordPress' own cron and site health call the site itself.
SecRule REQUEST_FILENAME "@rx /wp-cron\.php$" \
    "id:1009,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920180,ctl:ruleRemoveById=920300"
