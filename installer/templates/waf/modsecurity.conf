# Managed by the Webhosting Panel installer (module waf). Engine settings for
# ModSecurity v3; the rule engine itself (On or DetectionOnly) is set per site
# by whp-agent (waf.apply), so a site without a setting never blocks.

SecRequestBodyAccess On
# Uploads bigger than this are only inspected for their first part, never refused.
SecRequestBodyLimit 13107200
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off

SecTmpDir /var/cache/modsecurity
SecDataDir /var/cache/modsecurity
SecArgumentSeparator &
SecCookieFormat 0
SecStatusEngine Off

# XML and JSON bodies are parsed, so their fields are checked like form fields.
SecRule REQUEST_HEADERS:Content-Type "@rx ^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:[a-z0-9.+-]+\+)?json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
# A body that cannot be parsed would hide an attack: refuse it (sites in block mode).
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

# Audit log: one JSON line per request that matched a rule. No request or
# response bodies (passwords, personal data); the agent reads it (waf.events).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^$"
SecAuditLogParts ABHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsecurity/audit.log
