# Managed by the Webhosting Panel installer (module waf). Loaded once for all
# websites from /etc/nginx/conf.d/whp-waf.conf; a site uses it only when the
# panel switches the firewall on for it (/etc/nginx/whp/sites/<domain>/20-waf.conf).
Include /etc/nginx/whp/waf/modsecurity.conf
Include /etc/nginx/whp/waf/crs-setup.conf
# Written by whp-agent (waf.apply): paranoia level and threshold.
Include /etc/nginx/whp/waf/server.conf
Include /etc/nginx/whp/waf/before-crs.conf
Include {{WAF_CRS_RULES}}/*.conf
Include /etc/nginx/whp/waf/after-crs.conf
# Written by whp-agent (waf.apply): exceptions for every website.
Include /etc/nginx/whp/waf/server-exceptions.conf
