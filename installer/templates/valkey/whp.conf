# Managed by the Webhosting Panel installer.
bind 127.0.0.1 -::1
port 6379
protected-mode yes
aclfile /etc/valkey/users.acl
maxmemory {{VALKEY_MAXMEM}}mb
# Evict only keys that have a TTL (cache, sessions); queue jobs are kept.
maxmemory-policy volatile-lru
tcp-keepalive 60
save 900 1
save 300 100
appendonly no
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
