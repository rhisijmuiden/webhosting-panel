# Managed by the Webhosting Panel installer. Dovecot 2.4 syntax.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp sieve
listen = *, ::
postmaster_address = postmaster@{{WHP_HOSTNAME}}
hostname = {{WHP_HOSTNAME}}

# Virtual users: /etc/dovecot/users is used for both passdb and userdb.
# Format: user@domain:{ARGON2ID}hash::::::[userdb_quota_rule=*:storage=1G]
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_home = /var/vmail/%{user | domain | lower}/%{user | username | lower}
mail_driver = maildir
mail_path = ~/Maildir
mail_fsync = optimized

auth_mechanisms = plain login
auth_allow_cleartext = no
auth_username_format = %{user | lower}
auth_failure_delay = 2 secs

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

# IMAP import (agent mail.imap_import_*): imapsync logs in to the target
# mailbox as master user whp-import, only from loopback (allow_nets in the file).
passdb whp_import {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/master-users
  master = yes
  result_success = continue
}

ssl = yes
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = {{DOVECOT_CERT}}
ssl_server_key_file = {{DOVECOT_KEY}}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  # Spam quarantine: not auto-created, it appears once something is held back.
  mailbox Quarantine {
    autoexpunge = 30d
  }
}

# IMAPS for clients; plain IMAP only on loopback (webmail on this host).
service imap-login {
  inet_listener imap {
    listen = 127.0.0.1, ::1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# Spam routing (quarantine / Junk), runs before the user's own filters.
# The panel agent rewrites and compiles this script (mail.spam_policy_sync).
sieve_script whp_spam {
  type = before
  driver = file
  path = /var/lib/webhosting-panel/mail/sieve/before.sieve
}

# Autoresponder of the mailbox (agent mail.autoreply_sync). Most mailboxes
# have none; a missing script is skipped.
sieve_script whp_autoreply {
  type = before
  driver = file
  path = ~/whp-autoreply.sieve
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

protocol imap {
  mail_max_userip_connections = 30
}
