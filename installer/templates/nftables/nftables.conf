#!/usr/sbin/nft -f
# Managed by the Webhosting Panel installer. Local additions: /etc/nftables.d/*.nft
# Only the table inet whp is replaced on reload; CrowdSec keeps its own tables.

table inet whp
delete table inet whp

table inet whp {
	set tcp_open {
		type inet_service
		flags interval
		elements = { {{FW_TCP}} }
	}
	set udp_open {
		type inet_service
		flags interval
		elements = { {{FW_UDP}} }
	}
	set blocked_v4 {
		type ipv4_addr
		flags interval
	}
	set blocked_v6 {
		type ipv6_addr
		flags interval
	}
	set ssh_meter_v4 {
		type ipv4_addr
		size 65535
		flags dynamic,timeout
		timeout 1m
	}
	set ssh_meter_v6 {
		type ipv6_addr
		size 65535
		flags dynamic,timeout
		timeout 1m
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		ip saddr @blocked_v4 drop
		ip6 saddr @blocked_v6 drop

		ip protocol icmp icmp type { echo-request } limit rate 10/second accept
		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp accept

		# Brute force brake on SSH: max 10 new connections per minute per address.
		tcp dport {{WHP_SSH_PORT}} ct state new add @ssh_meter_v4 { ip saddr limit rate over 10/minute burst 5 packets } drop
		tcp dport {{WHP_SSH_PORT}} ct state new add @ssh_meter_v6 { ip6 saddr limit rate over 10/minute burst 5 packets } drop

		tcp dport @tcp_open ct state new accept
		udp dport @udp_open accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
