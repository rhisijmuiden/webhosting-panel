    # The whole site is a Node.js or Python app (panel: Node.js & Python), PHP is not used.
    root {{SITE_DOCROOT}};
    access_log {{SITE_ROOT}}/logs/access.log whp buffer=32k flush=5s;
    access_log /var/log/nginx/whp-traffic.log whp_traffic buffer=64k flush=1m;
    error_log {{SITE_ROOT}}/logs/error.log warn;
    include /etc/nginx/whp/headers.conf;
    limit_conn whp_conn 100;
    limit_req zone=whp_general burst=200 nodelay;

    location ~ /\.(?!well-known/) { deny all; return 404; }
    include /etc/nginx/whp/sites/{{SITE_DOMAIN}}/*.conf;

    location / {
        proxy_pass http://127.0.0.1:{{SITE_PROXY}};
        include /etc/nginx/whp/proxy.conf;
        error_page 502 503 504 @whp_app_down;
    }

    # A stopped, starting or crashed app: a friendly page instead of a bare 502.
    location @whp_app_down {
        root /etc/nginx/whp/pages;
        try_files /app-down.html =502;
    }
