    # Suspended by whp-site: every request gets the 503 page, PHP is stopped.
    root {{SITE_DOCROOT}};
    access_log {{SITE_ROOT}}/logs/access.log whp buffer=32k flush=5s;
    error_log {{SITE_ROOT}}/logs/error.log warn;
    error_page 503 /whp-suspended.html;

    location = /whp-suspended.html {
        internal;
        alias /etc/nginx/whp/pages/suspended.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 3600 always;
        include /etc/nginx/whp/headers.conf;
    }

    location / { return 503; }
