# Managed by the Webhosting Panel installer: page cache and limits.

fastcgi_cache_path /var/cache/nginx/whp levels=1:2 keys_zone=WHP:128m max_size={{NGINX_CACHE_MAX}}g inactive=2h use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_buffers 32 32k;
fastcgi_buffer_size 64k;
fastcgi_read_timeout 300s;

# Requests that must never come from the cache.
map $request_method $whp_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}
map $args $whp_skip_args {
    default 1;
    "" 0;
    "~^(utm_[a-z]+|fbclid|gclid|ref)=" 0;
}
map $http_cookie $whp_skip_cookie {
    default 0;
    "~*(wordpress_logged_in|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session|PHPSESSID|laravel_session|XSRF-TOKEN|whp_nocache)" 1;
}
map $request_uri $whp_skip_uri {
    default 0;
    "~*^/(wp-admin|wp-login\.php|wp-cron\.php|wp-json|xmlrpc\.php|feed|cart|checkout|my-account|login|logout|register|admin|api)" 1;
    "~*/(sitemap(_index)?\.xml|.*sitemap.*\.xml)$" 0;
}
map "$whp_skip_method$whp_skip_args$whp_skip_cookie$whp_skip_uri" $whp_skip_cache {
    default 1;
    "0000" 0;
}

# Rate limits, used by the login and API locations of the vhosts.
limit_req_zone $binary_remote_addr zone=whp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=whp_general:20m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=whp_conn:20m;
limit_req_status 429;
limit_conn_status 429;

ssl_session_cache shared:WHPSSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;
