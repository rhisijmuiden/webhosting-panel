    root {{SITE_DOCROOT}};
    index index.php index.html index.htm;
    access_log {{SITE_ROOT}}/logs/access.log whp buffer=32k flush=5s;
    error_log {{SITE_ROOT}}/logs/error.log warn;
    limit_conn whp_conn 100;
    limit_req zone=whp_general burst=200 nodelay;

    include /etc/nginx/whp/deny.conf;
    include /etc/nginx/whp/static.conf;
    include /etc/nginx/whp/sites/{{SITE_DOMAIN}}/*.conf;

    location = /wp-login.php {
        limit_req zone=whp_login burst=5 nodelay;
        fastcgi_pass unix:/run/php/site-{{SITE_ID}}.sock;
        include /etc/nginx/whp/php-nocache.conf;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php(?:$|/) {
        fastcgi_pass unix:/run/php/site-{{SITE_ID}}.sock;
        include /etc/nginx/whp/{{SITE_PHP_INCLUDE}};
    }
