# Managed by the Webhosting Panel installer: page cache on.
include /etc/nginx/whp/php-common.conf;
fastcgi_cache WHP;
# Cache files must not be held open: a purge (rm) has to take effect at once.
open_file_cache off;
fastcgi_cache_valid 200 301 302 10m;
fastcgi_cache_valid 404 1m;
fastcgi_cache_bypass $whp_skip_cache;
fastcgi_no_cache $whp_skip_cache;
fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
fastcgi_cache_background_update on;
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;
add_header X-Cache $upstream_cache_status always;
include /etc/nginx/whp/headers.conf;
