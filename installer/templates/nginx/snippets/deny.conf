# Managed by the Webhosting Panel installer: never serve these.
location ~ /\.(?!well-known/) { deny all; return 404; }
location ~* (?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|\.env.*|artisan|wp-config\.php\.bak|.*\.(?:sql|bak|old|orig|swp|log|ini|sh|dist))$ { deny all; return 404; }
location ~* ^/(?:wp-content/uploads|uploads|storage)/.*\.php$ { deny all; return 404; }
location = /xmlrpc.php { deny all; return 404; }
