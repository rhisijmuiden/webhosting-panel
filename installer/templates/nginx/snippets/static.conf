# Managed by the Webhosting Panel installer: long cache for static files.
location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|mp4|webm|pdf)$ {
    expires 30d;
    # Not in the site's access log, but counted as data traffic.
    access_log /var/log/nginx/whp-traffic.log whp_traffic buffer=64k flush=1m;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    include /etc/nginx/whp/headers.conf;
    try_files $uri =404;
}
