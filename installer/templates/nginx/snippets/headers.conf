# Managed by the Webhosting Panel installer.
# Included in every server and location that sets its own headers
# (nginx drops inherited add_header lines as soon as a block adds one).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS and Alt-Svc are only sent over HTTPS on port 443 (maps in conf.d/whp-http.conf).
add_header Strict-Transport-Security $whp_hsts always;
include /etc/nginx/whp/alt-svc.conf;
