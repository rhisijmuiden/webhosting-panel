# Managed by the Webhosting Panel installer: admin and client panel.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name {{WHP_HOSTNAME}};

    ssl_certificate {{CERT_FILE}};
    ssl_certificate_key {{KEY_FILE}};
    include /etc/nginx/whp/tls.conf;
    include /etc/nginx/whp/headers.conf;

    root /opt/webhosting-panel/panel/public;
    index index.php;
    access_log /var/log/webhosting-panel/nginx-access.log whp;
    error_log /var/log/webhosting-panel/nginx-error.log warn;
    client_max_body_size 512m;

    location ~ /\.(?!well-known/) { deny all; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/whp/headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        limit_req zone=whp_login burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Web terminal (packages/files): ttyd as the site user on a Unix socket per session.
    # The panel answers the auth_request: only the user who started the session gets in.
    location ~ ^/terminal/(?<whp_term>[a-f0-9]{32})/ {
        auth_request /_whp_terminal_auth;
        proxy_pass http://unix:/run/whp-terminal/$whp_term/ttyd.sock:;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location = /_whp_terminal_auth {
        internal;
        fastcgi_pass unix:/run/php/whp-panel.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /terminal/auth;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param QUERY_STRING "";
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param CONTENT_TYPE "";
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_HOST $host:$server_port;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass_request_body off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/whp-panel.sock;
        include /etc/nginx/whp/php-nocache.conf;
        # Debian's fastcgi_params pass $host (no port): keep :8443 for Laravel.
        fastcgi_param HTTP_HOST $host:$server_port;
    }
}

# The server hostname on the normal web ports: send visitors to the panel.
# ACME challenges stay reachable on port 80 for the hostname certificate.
server {
    listen 80;
    listen [::]:80;
    server_name {{WHP_HOSTNAME}};
    include /etc/nginx/whp/acme.conf;
    location / { return 301 https://$host:8443$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    {{PANEL_QUIC}}
    http2 on;
    server_name {{WHP_HOSTNAME}};

    ssl_certificate {{CERT_FILE}};
    ssl_certificate_key {{KEY_FILE}};
    include /etc/nginx/whp/tls.conf;
    include /etc/nginx/whp/headers.conf;
    include /etc/nginx/whp/acme.conf;
    location / { return 301 https://$host:8443$request_uri; }
}
