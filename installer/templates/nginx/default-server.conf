# Managed by the Webhosting Panel installer.
# Catches requests for unknown hosts. ACME challenges are always answered,
# so certificates can be issued before a site is created.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/whp/acme.conf;
    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    {{NGINX_QUIC_DEFAULT}}
    http2 on;
    server_name _;
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    include /etc/nginx/whp/tls.conf;
    ssl_reject_handshake on;
}
