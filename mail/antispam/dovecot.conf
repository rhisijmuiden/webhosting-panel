# Spam routing for the Webhosting Panel (Dovecot 2.4 syntax).
# Add to /etc/dovecot/dovecot.conf; the installer owns that file.

# Inside "namespace inbox { ... }": the folder the quarantine lives in.
# Not auto-created or subscribed: it appears once something is held back.
#   mailbox Quarantine {
#     autoexpunge = 30d
#   }

# Runs before the user's own Sieve filters. The agent (mail.spam_policy_sync)
# rewrites and compiles this script; ship before.sieve from this folder as the
# first version and compile it with: sievec /var/lib/webhosting-panel/mail/sieve/before.sieve
sieve_script whp_spam {
  type = before
  path = /var/lib/webhosting-panel/mail/sieve/before.sieve
}
